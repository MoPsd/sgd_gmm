[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sgd-gmm"
version = "0.1.0"
description = "Stochastic first-order learning for flexibly-tied Gaussian mixture models"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "torch",
]

[project.urls]
Paper = "https://doi.org/10.1016/j.patrec.2023.12.021"

[tool.setuptools.packages.find]
where = ["src"]
